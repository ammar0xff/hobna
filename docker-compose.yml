services:
  hobna:
    build: .
    image: hobna:latest
    container_name: hobna
    restart: unless-stopped
    environment:
      - PORT=3000
      - AMMAR_PASSWORD=ammar1234
      - ALAA_PASSWORD=alaa1234
      - GOOGLE_CLIENT_ID=629345404612-o215mbr2f5v2s3jpi24re8r4sgntq5c3.apps.googleusercontent.com
      - GOOGLE_CLIENT_SECRET=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
      - GOOGLE_REDIRECT_URI=http://hobna.homie.local/api/auth/google/callback
    volumes:
      - hobna_data:/app/data
    ports:
