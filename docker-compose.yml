services:
  hobna:
    build: .
    image: hobna:latest
    container_name: hobna
    restart: unless-stopped
    environment:
      - PORT=${PORT:-3000}
      - AMMAR_PASSWORD=${AMMAR_PASSWORD:?set AMMAR_PASSWORD in your .env}
      - ALAA_PASSWORD=${ALAA_PASSWORD:?set ALAA_PASSWORD in your .env}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-http://localhost:3000/api/auth/google/callback}
    volumes:
      - hobna_data:/app/data
    ports:
      - "8789:3000"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  hobna_data:
